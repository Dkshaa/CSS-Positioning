<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Demo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 24px;
        }

        .demo-box {
            box-sizing: border-box;
            margin: 10px;
            padding: 10px;
            display: inline-block;
            border: 1px solid gray;
            width: 100px;
            height: 200px;
            vertical-align: top;
        }

        #div1 {
            background-color: antiquewhite;
        }

        #div2 {
            position: relative;
            top: 10px;
            background-color: aquamarine;
        }

        #div3 {
            background-color: yellowgreen;
        }
    </style>
</head>
<body>
    <main>
        <h1>CSS Positioning Demo</h1>
        <p>The second box uses relative positioning, so it moves down without changing the normal space reserved for it.</p>

        <section aria-label="Relative positioning example">
            <div id="div1" class="demo-box">Box 1</div>
            <div id="div2" class="demo-box">Box 2</div>
            <div id="div3" class="demo-box">Box 3</div>
        </section>
    </main>
</body>
</html>
